sonar.projectKey=nangman-crypto-domain-replay-supervisor
sonar.projectName=nangman-crypto-domain-replay-supervisor
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,ecs,config,.github/workflows
sonar.tests=src
sonar.test.inclusions=src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs
sonar.exclusions=target/**,sonar-reports/**,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs
sonar.coverage.exclusions=ecs/**,config/**,.github/**,src/main.rs,src/planning/input.rs,src/output/s3.rs,src/run/**,src/types/**,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs

sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=sonar-reports/clippy.json
sonar.rust.lcov.reportPaths=sonar-reports/lcov.info
